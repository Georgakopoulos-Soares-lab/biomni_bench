# Site-specific cluster configuration. COPY to configs/cluster.yaml and fill in.
# configs/cluster.yaml is gitignored: it may contain a private allocation name.
#
# Validate with:
#   python -m biomni_uncertainty.cli check-cluster --cluster-config configs/cluster.yaml
# Any value left as "<...>", empty, or null is reported as an unresolved
# placeholder and blocks the launch.

slurm:
  account: "<YOUR_ALLOCATION>"       # e.g. the -A / --account value
  partition: "<YOUR_PARTITION>"      # e.g. a GPU partition name
  qos: ""                            # "" if the site has no QoS concept
  wall_time: "12:00:00"
  nodes: 2
  gpus_per_node: 4
  cpus_per_task: 32
  memory: "0"                        # "0" = all memory on the node
  job_name: biomni-unc-phase1
  mail_user: ""                      # optional

paths:
  # Shared project checkout (this repository).
  project_root: "<ABSOLUTE_PATH_TO>/biomni-uncertainty"
  # Pinned upstream Biomni checkout.
  biomni_src: "<ABSOLUTE_PATH_TO>/Biomni"
  # Shared Biomni data lake root: $BIOMNI_PATH/biomni_data/{data_lake,benchmark}.
  # Treated as read-only during runs.
  data_lake_root: "<ABSOLUTE_PATH_TO>/biomni_data_root"
  # Node-local fast scratch, used for temporary files during a trajectory.
  node_scratch: "/tmp/biomni_unc_scratch"
  # Where model weights live (a Hugging Face snapshot directory or a repo id).
  model_path: "<ABSOLUTE_PATH_TO>/hf_cache/hub/models--biomni--Biomni-R0-32B-Preview/snapshots/<REVISION>"
  hf_home: "<ABSOLUTE_PATH_TO>/hf_cache"
  # Python interpreters. Two environments so the serving stack cannot break the
  # agent stack (see DECISIONS.md D-05).
  agent_python: "<ABSOLUTE_PATH_TO>/envs/biomni_unc/bin/python"
  server_python: "<ABSOLUTE_PATH_TO>/envs/sglang_srv/bin/python"
  # Where run outputs are written.
  output_root: "<ABSOLUTE_PATH_TO>/runs"

serving:
  # "auto" picks TP2 x 2 replicas per node on >=70 GB GPUs, TP4 x 1 replica
  # otherwise. Set to "tp2" or "tp4" to override.
  layout: auto
  base_port: 30000
  mem_fraction_static: 0.85
  context_length: 40960
  dtype: bfloat16
  trust_remote_code: true
  # Leave empty to keep the model's native RoPE configuration. Only set this if
  # a smoke test demonstrates context overflow; it changes an experimental
  # parameter (DECISIONS.md D-04).
  json_model_override_args: ""
  startup_timeout_seconds: 2400
  health_poll_interval_seconds: 10

dispatch:
  # One active agent trajectory per model replica is the conservative default.
  max_concurrent_per_endpoint: 1
  max_concurrency: 4

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biomni-uncertainty"
version = "0.1.0"
description = "Evaluating and improving the reliability of autonomous biomedical AI agents through uncertainty benchmarks and trajectory-ensemble distillation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "pyarrow",
    "numpy",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "pyyaml",
    "pydantic>=2",
    "requests",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
